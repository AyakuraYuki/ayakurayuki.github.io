name: Blog release (manual)
run-name: "${{ inputs.publish && 'Publish' || 'Build only' }} · ${{ github.ref_name }} · ${{ inputs.expected_commit }}"

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Exact 40-character SHA; publishing is allowed from rhine-blog or codex/rhine-blog"
        required: true
        type: string
      publish:
        description: "Deploy the verified artifact to the existing production Pages site"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "For publishing only, type blog.ayakurayuki.cc"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Serialize releases from both supported branches; never interrupt a deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      TZ: Asia/Shanghai
      ARCHIVE_TEST_RENDERING: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify explicit release intent
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_REF: ${{ github.ref }}
        run: node scripts/release-guard.mjs --check
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:release
      - name: Install browser dependencies (bounded retries)
        timeout-minutes: 6
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx --no-install playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/browser-setup.log"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Browser dependency setup failed (attempt $attempt); retrying once the runner/network settles."
              sleep 15
            fi
          done
          echo "Browser dependency setup failed after 3 attempts. Tests and deployment are blocked."
          python3 - "$RUNNER_TEMP/browser-setup.log" <<'PYLOG'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          errors = [line for line in lines if re.search(r'error|failed|^E:', line, re.I)]
          message = '\n'.join((errors or lines)[-12:])[-3000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Browser dependency setup::' + message)
          PYLOG
          exit 1
      - name: Test the actual release output
        env:
          SITE_BUILD: production
        run: npm run test:browser
      - name: Save release for review or rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blog-release-${{ github.sha }}
          path: site/dist-release/
          include-hidden-files: true
          retention-days: 90
      - name: Package the tested Pages artifact
        if: ${{ inputs.publish && inputs.confirmation == 'blog.ayakurayuki.cc' && (github.ref == 'refs/heads/rhine-blog' || github.ref == 'refs/heads/codex/rhine-blog') }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist-release/
  deploy:
    if: ${{ inputs.publish && inputs.confirmation == 'blog.ayakurayuki.cc' && (github.ref == 'refs/heads/rhine-blog' || github.ref == 'refs/heads/codex/rhine-blog') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # GitHub evaluates this environment BEFORE starting these steps.
    # Settings > Environments > github-pages must independently allow both
    # branch names exactly: rhine-blog and codex/rhine-blog (not wildcard tags).
    # A YAML branch gate cannot override remote deployment protection rules.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require an already-configured Pages site (read-only check)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh api "repos/$REPOSITORY/pages" > "$RUNNER_TEMP/pages-state.json"
          python3 - "$RUNNER_TEMP/pages-state.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1]))
          if state.get('build_type') != 'workflow' or state.get('cname') != 'blog.ayakurayuki.cc':
              raise SystemExit('Pages source/domain differs from the approved destination. Nothing was changed; configure and review it separately.')
          PY
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
