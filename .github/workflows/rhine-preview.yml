name: Rhine blog migration checks (no deployment)

on:
  push:
    branches: [codex/rhine-blog]
  pull_request:
    branches: [hugo]
    paths:
      [
        "site/**",
        "content/**",
        "static/**",
        "migration/**",
        ".github/workflows/rhine-preview.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhine-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-09
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rhine-preview-${{ github.sha }}
          path: |
            site/dist/
            site/.cache/output-report.json
            site/test-results/
          include-hidden-files: true
          retention-days: 14
# Deliberately no pages:write, id-token:write, deploy-pages, CNAME changes or production environment.
