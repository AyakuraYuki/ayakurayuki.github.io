name: Blog checks (no deployment)

on:
  push:
    branches: [rhine-blog, codex/rhine-blog]
  pull_request:
    branches: [rhine-blog, codex/rhine-blog]
    paths:
      [
        "site/**",
        "content/**",
        "static/**",
        "migration/**",
        ".github/workflows/rhine-preview.yml",
        ".github/workflows/blog-release.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhine-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      TZ: Asia/Shanghai
      ARCHIVE_TEST_RENDERING: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-09
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run verify:release
      - name: Install browser dependencies (bounded retries)
        timeout-minutes: 6
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx --no-install playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/browser-setup.log"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Browser dependency setup failed (attempt $attempt); retrying once the runner/network settles."
              sleep 15
            fi
          done
          echo "Browser dependency setup failed after 3 attempts. Tests and deployment are blocked."
          python3 - "$RUNNER_TEMP/browser-setup.log" <<'PYLOG'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          errors = [line for line in lines if re.search(r'error|failed|^E:', line, re.I)]
          message = '\n'.join((errors or lines)[-12:])[-3000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Browser dependency setup::' + message)
          PYLOG
          exit 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: blog-checks-${{ github.sha }}
          path: |
            site/dist/
            site/dist-release/
            site/.cache/output-report.json
            site/.cache/release-output-report.json
            site/test-results/
          include-hidden-files: true
          retention-days: 14
# Deliberately no pages:write, id-token:write, deploy-pages, CNAME changes or production environment.
